appId: com.foxlogi.overlay
productName: Foxlogi Overlay
directories:
  buildResources: build
  output: dist
files:
  - out/**/*
  - package.json
asar: true
# Native modules must load from real files: the global key listener (map watch)
# and koffi's per-platform binary (Windows right-click hook).
asarUnpack:
  - node_modules/uiohook-napi/**
  - node_modules/@koromix/**
# The native dependencies (uiohook-napi, koffi) ship N-API prebuilds, which are
# ABI-stable across Electron versions, so skip @electron/rebuild — its node-abi
# lags new Electron majors and fails the build. Re-enable if a non-N-API native
# module is ever added.
npmRebuild: false

# Publish auto-updates via GitHub Releases (electron-updater).
publish:
  provider: github
  owner: SuddenDeathMP
  repo: foxlogi-overlay

win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  # Authenticode signing avoids SmartScreen warnings (set CSC_LINK / CSC_KEY_PASSWORD env vars).

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

mac:
  category: public.app-category.utilities
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
  # Auto-update on macOS REQUIRES signing + notarization.
  hardenedRuntime: true
  gatekeeperAssess: false
  # Electron 39+ requires this key for any desktopCapturer use on macOS 14.2+,
  # even screen-only capture (grid detect, map watch). We never capture audio.
  extendInfo:
    NSAudioCaptureUsageDescription: Foxlogi Overlay does not capture audio.

linux:
  category: Utility
  target:
    - AppImage
    - deb
  maintainer: FoxholeLogistics
  # Run under XWayland: native Wayland (Electron 38+ default) breaks always-on-top,
  # click-through and global shortcuts. src/main/index.ts relaunches with the
  # same flag when the app is started without it.
  executableArgs:
    - --ozone-platform=x11
